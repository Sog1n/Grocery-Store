# Tên của workflow hiển thị trên GitHub Actions tab
name: Server CI

# Khi nào workflow này sẽ được kích hoạt?
on:
  # Khi push code lên branch main hoặc dev
  push:
    branches: [ main, dev ]
  # Khi tạo pull request vào branch main hoặc dev
  pull_request:
    branches: [ main, dev ]

jobs:
  # job 1: unit test
  unit-test:
    name: Unit Tests
    # Chạy trên máy ảo Ubuntu (Linux) phiên bản mới nhất
    runs-on: ubuntu-latest
    
    steps:
    # Bước 1: Lấy code từ repository về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Bước 2: Cài đặt Node.js phiên bản 20
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'  # Sử dụng Node.js version 20
        cache: 'npm'  # Cache npm để cài đặt nhanh hơn
        cache-dependency-path: server/package-lock.json  # Đường dẫn file lock
    
    # Bước 3: Cài đặt tất cả dependencies từ package.json
    - name: Install dependencies
      working-directory: ./server  # Chạy lệnh trong thư mục server
      run: npm ci  # npm ci = clean install (nhanh hơn npm install)
    
    # Bước 4: Chạy unit tests
    - name: Run Unit Tests
      working-directory: ./server
      run: npm run test:unit  # Chạy script test:unit trong package.json
      env:
        NODE_ENV: test  # Set môi trường là test

