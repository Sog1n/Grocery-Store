version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: taphoa_mongodb
    restart: always
    ports:
      - "${MONGODB_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - taphoa_network

  # Backend Server (Client)
  backend_client:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taphoa_backend_client
    restart: always
    ports:
      - "${BACKEND_PORT}:8080"
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - taphoa_network

  # Frontend Client
  frontend_client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taphoa_frontend_client
    restart: always
    ports:
      - "${FRONTEND_PORT}:5173"
    env_file:
      - ./client/.env
    depends_on:
      - backend_client
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - taphoa_network

  # Backend Server (Admin)
  backend_admin:
    build:
      context: ./admin_server
      dockerfile: Dockerfile
    container_name: taphoa_backend_admin
    restart: always
    ports:
      - "${BACKEND_ADMIN_PORT}:8081"
    env_file:
      - ./admin_server/.env
    depends_on:
      - mongodb
    volumes:
      - ./admin_server:/app
      - /app/node_modules
    networks:
      - taphoa_network

  # Frontend Admin
  frontend_admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: taphoa_frontend_admin
    restart: always
    ports:
      - "${FRONTEND_ADMIN_PORT}:5174"
    env_file:
      - ./admin/.env
    depends_on:
      - backend_admin
    volumes:
      - ./admin:/app
      - /app/node_modules
    networks:
      - taphoa_network

networks:
  taphoa_network:
    driver: bridge

volumes:
  mongodb_data: